resolver [fd12::10] valid=10s ipv6=on;

server {
    listen 80;
    server_name debateai.cc www.debateai.cc;

    # X-Forwarded-Proto is hardcoded to "https" rather than $scheme:
    # Railway's edge terminates TLS and forwards to this container over
    # plain HTTP, so nginx's own $scheme is always "http" here. This
    # service is only ever reached through that HTTPS-terminating edge,
    # so hardcoding is correct and avoids depending on whether the edge
    # also sets its own X-Forwarded-Proto header.

    # Railway private networking: <service-name>.railway.internal
    # These names must match the Railway service names exactly.
    # NOTE: the "web" service's internal hostname is "debate-ai" because it
    # was repurposed from Railway's auto-created service (named after the
    # GitHub repo) rather than created fresh — renaming a service's display
    # name does not change its private-networking hostname.
    set $django_wsgi_upstream debate-ai.railway.internal:8000;
    set $django_asgi_upstream asgi.railway.internal:8001;
    set $nextjs_upstream frontend.railway.internal:3000;

    location /api/ws/ {
        proxy_pass http://$django_asgi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$django_wsgi_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        proxy_pass http://$django_wsgi_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        proxy_pass http://$django_wsgi_upstream;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://$nextjs_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
